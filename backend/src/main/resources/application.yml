spring:
  application:
    name: CodeMentor AI
  datasource:
    url: jdbc:postgresql://localhost:5432/codementor_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always

# JWT Security
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970} # 256-bit hex for development only
  expiration-ms: 86400000 # 24 hours
  refresh-expiration-ms: 604800000 # 7 days

# AI Integration APIs
ai:
  groq:
    api-key: ${GROQ_API_KEY:your_groq_api_key_here}
    url: https://api.groq.com/openai/v1/chat/completions
  gemini:
    api-key: ${GEMINI_API_KEY:your_gemini_api_key_here}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-pro-latest:generateContent
  huggingface:
    api-key: ${HUGGINGFACE_API_KEY:your_huggingface_api_key_here}
    url: https://api-inference.huggingface.co/models/
  

logging:
  level:
    org.springframework.security: DEBUG
    com.codementor.ai: DEBUG
